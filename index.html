<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1>待办事项提示框</h1>
        <p class="subtitle">记录今天要完成的事</p>
      </header>

      <form class="todo-form" id="todo-form" autocomplete="off">
        <input
          type="text"
          id="todo-input"
          class="todo-input"
          placeholder="添加一项任务…"
          maxlength="200"
          required
        />
        <button type="submit" class="btn-add" aria-label="添加任务">添加</button>
      </form>

      <div class="toolbar">
        <span class="count" id="count">0 项未完成</span>
        <div class="filters" role="tablist">
          <button type="button" class="filter is-active" data-filter="all">全部</button>
          <button type="button" class="filter" data-filter="active">未完成</button>
          <button type="button" class="filter" data-filter="completed">已完成</button>
        </div>
        <button type="button" class="btn-clear" id="clear-completed">清除已完成</button>
      </div>

      <ul class="todo-list" id="todo-list"></ul>

      <p class="empty" id="empty-state">还没有任务，在上方添加一条吧。</p>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
